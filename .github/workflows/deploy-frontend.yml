name: Deploy Frontend to S3

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }} # e.g., ap-south-1

      - name: Deploy Assets to S3
        run: |
          # Sync new assets to S3 (keep existing hashed JS/CSS chunks to prevent 404s for cached clients)
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }} --exclude "index.html"
          # Overwrite index.html with strict no-cache headers
          aws s3 cp dist/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html --cache-control "max-age=0, no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache
        continue-on-error: true
        run: |
          DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -z "$DIST_ID" ]; then
            echo "Auto-detecting CloudFront distribution ID for hrms.focusengineeringapp.com..."
            DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, 'hrms.focusengineeringapp.com')].Id" --output text 2>/dev/null || true)
          fi
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[0].Id" --output text 2>/dev/null || true)
          fi
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            echo "Found CloudFront Distribution: $DIST_ID. Creating invalidation..."
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          else
            echo "No CloudFront distribution found to invalidate."
          fi


